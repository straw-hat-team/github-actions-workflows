on:
  workflow_call:
    inputs:
      elixir-version:
        description: The Elixir version. It fallback to .tool-versions if not specified
        type: string
        required: false
      otp-version:
        description: The Erlang version. It fallback to .tool-versions if not specified
        type: string
        required: false
      version-type:
        description: The versioning type check, either strict or loose
        type: string
        required: false
        default: strict
      package-name:
        description: The package name. For umbrella apps, resolves to apps/<package-name>. Omit for single-package repos.
        type: string
        required: false
      environment:
        description: The GitHub environment the publishing job runs in. A Hex Workload Identity on a public repository requires one
        type: string
        required: false
        default: ""
      hex-ref:
        description: The hexpm/hex Git ref to install Hex from when HEX_API_KEY is not set. Defaults to Hex 2.6.0, the first release with Workload Identity, which requires Elixir 1.12 and OTP 27 or later
        type: string
        required: false
        default: edec2dda0968d5a6babd202bad17fcea2d1640bb
    secrets:
      HEX_API_KEY:
        description: The hex.pm API key. Leave it unset to publish with a Hex Workload Identity
        required: false

jobs:
  publish-docs:
    name: Publish Docs to Hex.pm
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: straw-hat-team/github-actions-workflows/elixir/publish-docs@a5940bd7110b44acd9fd23b250e95ed4bc3e8848 # v1.11.0
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
          version-type: ${{ inputs.version-type }}
          hex-api-key: ${{ secrets.HEX_API_KEY }}
          hex-ref: ${{ inputs.hex-ref }}
          package-name: ${{ inputs.package-name }}
