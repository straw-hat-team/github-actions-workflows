on:
  workflow_call:
    inputs:
      elixir-version:
        description: The Elixir version. It fallback to .tool-versions if not specified
        type: string
        required: false
      otp-version:
        description: The Erlang version. It fallback to .tool-versions if not specified
        type: string
        required: false
      version-type:
        description: The versioning type check, either strict or loose
        type: string
        required: false
        default: strict
    secrets:
      HEX_API_KEY:
        description: The hex.pm API key
        required: true

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: straw-hat-team/github-actions-workflows/elixir/publish@5ab906d801d41b723636b498e57509e18db1856a # v1.9.1
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
          version-type: ${{ inputs.version-type }}
          hex-api-key: ${{ secrets.HEX_API_KEY }}
