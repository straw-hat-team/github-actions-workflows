on:
  workflow_call:
    inputs:
      elixir-version:
        description: The Elixir version. It fallback to .tool-versions if not specified
        type: string
        required: false
      otp-version:
        description: The Erlang version. It fallback to .tool-versions if not specified
        type: string
        required: false
      version-type:
        description: The versioning type check, either strict or loose
        type: string
        required: false
        default: strict
    secrets:
      HEX_API_KEY:
        description: The hex.pm API key
        required: true

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: straw-hat-team/github-actions-workflows/elixir/publish@d9f6ba300b84655b70cc33c885e8848f9dde8efa # v1.7.7
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
          version-type: ${{ inputs.version-type }}
          hex-api-key: ${{ secrets.HEX_API_KEY }}
