on:
  workflow_call:
    inputs:
      elixir-version:
        description: The Elixir version. It fallback to .tool-versions if not specified
        type: string
        required: false
      otp-version:
        description: The Erlang version. It fallback to .tool-versions if not specified
        type: string
        required: false
      version-type:
        description: The versioning type check, either strict or loose
        type: string
        required: false
        default: strict
    secrets:
      HEX_API_KEY:
        description: The hex.pm API key
        required: true

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: straw-hat-team/github-actions-workflows/elixir/publish@0566a3861e8d30656cd902efd6208247df46bf60 # v1.8.0
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
          version-type: ${{ inputs.version-type }}
          hex-api-key: ${{ secrets.HEX_API_KEY }}
