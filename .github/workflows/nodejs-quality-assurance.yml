on:
  workflow_call:
    inputs:
      jest-enabled:
        description: Enables the Jest testing job
        type: boolean
        required: false
        default: true
      prettier-enabled:
        description: Enables the Prettier formatter job
        type: boolean
        required: false
        default: true
    secrets:
      SHT_NPM_TOKEN:
        description: The Straw Hat NPM Token that may be injected into the .yarnrc.yml file
        required: false

jobs:
  jest:
    name: Jest
    if: ${{ inputs.jest-enabled }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: straw-hat-team/github-actions-workflows/nodejs/setup@a5940bd7110b44acd9fd23b250e95ed4bc3e8848 # v1.11.0
      - shell: sh
        run: yarn install --immutable
        env:
          SHT_NPM_TOKEN: ${{ secrets.SHT_NPM_TOKEN }}
      - uses: straw-hat-team/github-actions-workflows/nodejs/jest@a5940bd7110b44acd9fd23b250e95ed4bc3e8848 # v1.11.0
        with:
          sht-npm-token: ${{ secrets.SHT_NPM_TOKEN }}

  prettier:
    name: Prettier
    if: ${{ inputs.prettier-enabled }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: straw-hat-team/github-actions-workflows/nodejs/setup@a5940bd7110b44acd9fd23b250e95ed4bc3e8848 # v1.11.0
      - shell: sh
        run: yarn install --immutable
        env:
          SHT_NPM_TOKEN: ${{ secrets.SHT_NPM_TOKEN }}
      - uses: straw-hat-team/github-actions-workflows/nodejs/prettier@a5940bd7110b44acd9fd23b250e95ed4bc3e8848 # v1.11.0
        with:
          sht-npm-token: ${{ secrets.SHT_NPM_TOKEN }}
