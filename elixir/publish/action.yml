name: Elixir Publish
description: Publish an Elixir package to Hex.pm
author: Straw Hat Team

inputs:
  elixir-version:
    description: The Elixir version. It fallback to .tool-versions if not specified
    required: false
  otp-version:
    description: The Erlang version. It fallback to .tool-versions if not specified
    required: false
  version-type:
    description: The versioning type check, either strict or loose
    required: false
    default: strict
  hex-api-key:
    description: The hex.pm API key. Leave it empty to publish with a Hex Workload Identity
    required: false
    default: ""
  hex-ref:
    description: The hexpm/hex Git ref to install Hex from when hex-api-key is empty. Defaults to a Hex 2.6.0-dev commit that supports Workload Identity and requires Elixir 1.12 and OTP 27 or later
    required: false
    default: 4920866da55ec8e3b73f224d953309508f900e77

runs:
  using: composite
  steps:
    - name: Setup Elixir
      uses: straw-hat-team/github-actions-workflows/elixir/setup@55b445acf7641ffd48132742e4fe278718040d13 # master
      with:
        elixir-version: ${{ inputs.elixir-version }}
        otp-version: ${{ inputs.otp-version }}
        version-type: ${{ inputs.version-type }}
    - name: Install Hex
      if: inputs.hex-ref != '' && inputs.hex-api-key == ''
      env:
        HEX_REF: ${{ inputs.hex-ref }}
      shell: bash
      run: mix archive.install github hexpm/hex ref "$HEX_REF" --force
    - name: Run Hex Publish
      shell: sh
      run: mix hex.publish --yes
      env:
        HEX_API_KEY: ${{ inputs.hex-api-key }}
